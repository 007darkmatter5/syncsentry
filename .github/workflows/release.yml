name: Release

# beta branch -> image tags "beta" and "<version>-beta"
# main branch  -> image tags "latest", "sha-<12>", and "<version>"
# a v* tag     -> that semver tag only
# Versions are <VERSION file>.<run number>, so every release is unique and increasing.
# Creating the beta branch at main's commit does not change a file, so this line keeps the first beta publish from being skipped.
# Docs, the license, and the Unraid template don't change the image.
on:
  push:
    branches: [main, beta]
    tags: ["v*"]
    paths-ignore: ['**.md', 'LICENSE', 'docs/**', 'unraid/**']
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/007darkmatter5/syncsentry

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - run: dotnet restore
      - run: dotnet build --no-restore -c Release
      - run: dotnet test --no-build -c Release

  publish:
    needs: test
    if: github.repository == '007darkmatter5/syncsentry'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Refuse to publish outside github.com/007darkmatter5/syncsentry
        run: |
          if [ "$GITHUB_REPOSITORY" != "007darkmatter5/syncsentry" ]; then
            echo "Refusing to publish from $GITHUB_REPOSITORY"
            exit 1
          fi

      - name: Work out version and channel
        id: meta
        run: |
          sha="sha-${GITHUB_SHA::12}"
          base=$(tr -d '[:space:]' < VERSION)
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
            echo "tags=$IMAGE:$version" >> "$GITHUB_OUTPUT"
            echo "version=$version" >> "$GITHUB_OUTPUT"
            echo "channel=tag" >> "$GITHUB_OUTPUT"
          elif [ "$GITHUB_REF_NAME" = "main" ]; then
            # 0.1.0.<run> is a valid NuGet version. sha-<commit> is not (NETSDK1018).
            version="$base.$GITHUB_RUN_NUMBER"
            echo "tags=$IMAGE:$version,$IMAGE:latest,$IMAGE:$sha" >> "$GITHUB_OUTPUT"
            echo "version=$version" >> "$GITHUB_OUTPUT"
            echo "channel=latest" >> "$GITHUB_OUTPUT"
          else
            version="$base.$GITHUB_RUN_NUMBER-beta"
            echo "tags=$IMAGE:$version,$IMAGE:beta" >> "$GITHUB_OUTPUT"
            echo "version=$version" >> "$GITHUB_OUTPUT"
            echo "channel=beta" >> "$GITHUB_OUTPUT"
          fi
          echo "Releasing $version from $GITHUB_REF_NAME"

      - uses: docker/setup-buildx-action@v4

      - name: Build image for smoke test
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: syncsentry:smoke
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha,scope=${{ github.ref_name }}

      - name: Smoke test
        run: |
          set -eu
          smoke() {
            name=$1 expected_uid=$2; shift 2
            echo "::group::$name"
            docker run -d --name "$name" -p 8080:8080 -v "$PWD/$name/config:/config" "$@" syncsentry:smoke
            ok=""
            for i in $(seq 1 60); do
              if curl -fsS http://localhost:8080/healthz >/dev/null 2>&1; then ok=1; break; fi
              sleep 1
            done
            docker logs "$name"
            [ -n "$ok" ] || { echo "$name: never became healthy"; exit 1; }
            curl -fsS http://localhost:8080/Account/Login > login.html
            grep -q "Log in" login.html || grep -q "Create" login.html
            uid=$(docker exec "$name" cat /proc/1/status | awk '/^Uid:/ {print $2}')
            [ "$uid" = "$expected_uid" ] || { echo "$name: app runs as UID $uid, expected $expected_uid"; exit 1; }
            [ "$(sudo stat -c %u "$name/config/syncsentry.db")" = "$expected_uid" ] || { echo "$name: database not owned by $expected_uid"; exit 1; }
            sudo sh -c "ls $name/config/keys/key-*.xml"
            if docker logs "$name" 2>&1 | grep -E "^(fail|crit):"; then echo "$name: errors in startup logs"; exit 1; fi
            docker rm -f "$name"
            echo "::endgroup::"
          }

          sudo mkdir -p unraid/config
          smoke unraid 99 -e PUID=99 -e PGID=100

          sudo mkdir -p defaults/config && sudo chown -R 1654:1654 defaults
          smoke defaults 1654

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ github.ref_name }}
          cache-to: type=gha,mode=max,scope=${{ github.ref_name }}

      - name: Make the package public when the token can
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          code=$(curl -s -o visibility.json -w "%{http_code}" -X PUT \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/user/packages/container/syncsentry/visibility \
            -d '{"visibility":"public"}')
          echo "visibility update HTTP $code"
          cat visibility.json || true
          if [ "$code" != "200" ] && [ "$code" != "204" ]; then
            echo "The workflow token could not set the package to public. Set ghcr.io/007darkmatter5/syncsentry to Public in GitHub Packages if anonymous docker pull fails."
          fi
